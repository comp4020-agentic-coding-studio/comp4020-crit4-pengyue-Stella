<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Garden</title>
    <meta
      name="description"
      content="A tiny musical instrument: tap the soil to plant sounds on a scale that can't play a wrong note."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Sound Garden</h1>
      <div
        id="garden"
        data-testid="garden"
        aria-label="Garden soil --- tap or click anywhere to plant a sound"
      ></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
