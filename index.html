<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Garden</title>
    <meta
      name="description"
      content="A tiny musical instrument: tap the soil to plant sounds on a scale that can't play a wrong note."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Sound Garden</h1>
      <div
        id="garden"
        data-testid="garden"
        aria-label="Garden soil --- tap to plant a sound, drag to water"
      >
        <svg
          class="watering-cue"
          aria-hidden="true"
          focusable="false"
          viewBox="0 0 40 40"
          width="34"
          height="34"
        >
          <rect
            x="6"
            y="17"
            width="21"
            height="15"
            rx="5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M11 17a5 6 0 0 1 10 0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M24 20 L34 12"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <circle cx="35" cy="11" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4" />
          <circle
            class="watering-cue-drop watering-cue-drop-a"
            cx="33"
            cy="17"
            r="1.1"
            fill="currentColor"
          />
          <circle
            class="watering-cue-drop watering-cue-drop-b"
            cx="30"
            cy="22"
            r="0.9"
            fill="currentColor"
          />
        </svg>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
