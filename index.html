<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Garden</title>
    <meta
      name="description"
      content="A tiny musical instrument: tap the soil to plant sounds on a scale that can't play a wrong note."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Sound Garden</h1>
      <div
        id="garden"
        data-testid="garden"
        aria-label="Garden soil --- tap to use the selected tool; the watering can also works by dragging"
      ></div>
      <div class="tool-tray" role="group" aria-label="Garden tools" data-testid="tool-tray">
        <button type="button" class="tool-button" data-tool="flower" aria-pressed="true" aria-label="Flower">
          <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <path d="M20 34C20 24 18 20 20 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path d="M20 24Q13 22 12 27" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M20 20Q27 19 28 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <g fill="currentColor" stroke="currentColor" stroke-width="1.2">
              <circle cx="20" cy="8" r="3" />
              <circle cx="14" cy="10" r="3" />
              <circle cx="26" cy="10" r="3" />
              <circle cx="16" cy="4" r="3" />
              <circle cx="24" cy="4" r="3" />
            </g>
            <circle cx="20" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </button>
        <button type="button" class="tool-button" data-tool="grass" aria-pressed="false" aria-label="Bush">
          <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <path
              d="M8 30c-3-5 1-11 6-9 1-6 10-6 11 0 6-1 9 5 6 10-1 4-6 6-9 4-1 2-4 2-6 1-4 2-8-1-8-6z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button type="button" class="tool-button" data-tool="tree" aria-pressed="false" aria-label="Tree">
          <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <path
              d="M20 6L28 20L23 20L29 30L11 30L17 20L12 20Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <path d="M20 30L20 35" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <button type="button" class="tool-button" data-tool="water" aria-pressed="false" aria-label="Watering can">
          <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <rect x="6" y="17" width="21" height="15" rx="5" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M11 17a5 6 0 0 1 10 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path d="M24 20L34 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <circle cx="35" cy="11" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </button>
        <button type="button" class="tool-button" data-tool="shovel" aria-pressed="false" aria-label="Shovel">
          <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <path d="M13 5a4 4 0 1 0 0 8" fill="none" stroke="currentColor" stroke-width="1.8" />
            <line x1="13" y1="9" x2="24" y2="24" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path
              d="M19 22L30 18L33 25L24 33C20 33 18 29 19 22Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
